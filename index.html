<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nagah</title>
    <meta name="description" content="النجاح للتدريب والاستشارات — منصة إدارة الفروع والمعامل الذكية وملفات الإنجاز الرقمية" />
    <meta property="og:title" content="Nagah" />
    <meta property="og:description" content="النجاح للتدريب والاستشارات — منصة إدارة الفروع والمعامل الذكية وملفات الإنجاز الرقمية" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="النجاح للتدريب" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/logo-a.svg" />
    <link rel="apple-touch-icon" href="/logo-a.svg" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; color: #f8fafc; font-family: 'Cairo', sans-serif; text-align: center; padding: 20px;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(245, 158, 11, 0.15); border: 2px solid rgba(245, 158, 11, 0.4); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
          <div style="width: 24px; height: 24px; border: 3px solid #f59e0b; border-top-color: transparent; border-radius: 50%; animation: nagahSpin 0.8s linear infinite;"></div>
        </div>
        <h2 style="font-size: 20px; font-weight: 800; margin: 0 0 8px 0; color: #ffffff;">مؤسسة النجاح للتدريب والاستشارات</h2>
        <p style="font-size: 13px; color: #94a3b8; margin: 0;">جاري تحميل النظام والمزامنة السحابية...</p>
        <style>
          @keyframes nagahSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      // Automatic recovery from Vite chunk loading errors or stale Service Worker caches
      window.addEventListener('error', function (e) {
        var msg = e && e.message ? e.message.toLowerCase() : '';
        if (msg.indexOf('fetch') !== -1 || msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('chunk') !== -1 || msg.indexOf('import') !== -1) {
          var hasReloaded = sessionStorage.getItem('nagah_chunk_reload');
          if (!hasReloaded) {
            sessionStorage.setItem('nagah_chunk_reload', 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
                window.location.reload();
              }).catch(function() { window.location.reload(); });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
